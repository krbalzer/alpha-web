# Mirror of Libsyn episodes and Paylocity jobs every 6 hours (plus every deploy). Runs on GitHub, so it works on any Vercel plan.
# Repo secrets: SITE_URL (e.g. https://partnerwithalpha.com) and CRON_SECRET (same value as on Vercel).
name: Sync episodes + jobs
on:
  schedule: [{ cron: '7 */6 * * *' }]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run /api/cron/sync
        run: |
          curl -fsS --max-time 90 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/cron/sync"
