:root{--ink:#0E0E0D;--paper:#E8E4DA;--bone:#DEDAD1;--muted-d:#9B978E;--line-d:rgba(232,228,218,.14);--mono:"Diatype Mono",ui-monospace,Menlo,monospace;--disp:"NHD","Helvetica Neue",Arial,sans-serif}
body{margin:0;background:#1B1A18}
*{box-sizing:border-box}
.rv_bar{position:sticky;top:0;z-index:20;height:64px;background:#0E0E0D;color:var(--paper);border-bottom:1px solid var(--line-d);display:grid;grid-template-columns:auto auto 1fr auto;gap:18px;align-items:center;padding:0 24px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.rv_k{color:var(--muted-d)}
.rv_pick{position:relative}
.rv_cur{display:flex;align-items:center;gap:12px;height:38px;padding:0 14px 0 16px;border:1px solid rgba(232,228,218,.4);border-radius:999px;background:none;color:var(--paper);font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;min-width:320px;justify-content:space-between}
.rv_cur b{font-family:var(--disp);font-weight:900;font-size:15px;letter-spacing:0}
.rv_cur em{font-style:normal;color:var(--muted-d)}
.rv_list{position:absolute;top:46px;left:0;width:360px;max-height:560px;overflow:auto;background:#141412;border:1px solid var(--line-d);border-radius:6px;padding:6px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
.rv_list button{display:grid;grid-template-columns:44px 1fr;width:100%;text-align:left;padding:10px 10px;border:0;border-radius:4px;background:none;color:#B5B1A8;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.rv_list button:hover{background:#1F1E1B;color:var(--paper)}
.rv_list button.is-on{color:var(--paper);background:#24231F}
.rv_nav{display:flex;gap:6px}
.rv_nav button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(232,228,218,.4);background:none;color:var(--paper);cursor:pointer;font-size:14px}
.rv_src{justify-self:end;color:var(--muted-d);text-align:right;line-height:1.5}
.rv_stage{position:relative;width:1440px;margin:0 auto;background:#DEDAD1}
.rv_stage img{display:block;width:1440px;height:auto}
.rg{position:absolute;left:0;right:0;outline:1px dashed transparent;outline-offset:-1px;transition:outline-color .15s,background .15s}
.rg:hover{outline-color:rgba(201,162,107,.9);background:rgba(201,162,107,.06)}
.rg span{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;background:#0E0E0D;color:var(--paper);padding:4px 8px;border-radius:3px;opacity:0;transition:opacity .15s}
.rg:hover span{opacity:1}
</style>
</helmet>
<div>
<div class="rv_bar">
<span class="rv_k">Review / Brand template</span>
<div class="rv_pick"><button class="rv_cur" onClick="{{ toggle }}"><span><em>{{ cur.ptr }}</em>&#160;&#160;<b>{{ cur.name }}</b></span><span>{{ caret }}</span></button>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}"><div class="rv_list"><sc-for list="{{ list }}" as="o" hint-placeholder-count="15"><button class="{{ o.cls }}" onClick="{{ o.go }}"><em style="font-style: normal; color: #9B978E">{{ o.ptr }}</em><span>{{ o.name }}</span></button></sc-for></div></sc-if>
</div>
<div class="rv_nav"><button onClick="{{ prev }}" aria-label="Previous brand">←</button><button onClick="{{ next }}" aria-label="Next brand">→</button><span class="rv_k" style="align-self: center; margin-left: 8px">{{ pos }}</span></div>
<span class="rv_src">Captured Nov 4 from the latest build / real CMS content<br>Comment on any section to request a change</span>
</div>
<div class="rv_stage" style="height: {{ cur.H }}px">
<img src="{{ cur.img }}" alt="{{ cur.name }} brand page" width="1440">
<sc-for list="{{ secs }}" as="r" hint-placeholder-count="10"><div class="rg" style="top: {{ r.y }}px; height: {{ r.h }}px" data-section="{{ r.tag }}"><span>{{ r.tag }}</span></div></sc-for>
</div>
</div>
